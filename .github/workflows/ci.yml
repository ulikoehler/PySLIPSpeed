name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Tests with Coverage
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov coverage pyserial
    
    - name: Install package
      run: |
        pip install -e .
    
    - name: Run Python tests with coverage
      run: |
        pytest tests/test_slipspeed.py \
          --cov=slipspeed \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html \
          -v
    
    - name: Check coverage threshold (50%)
      run: |
        coverage report --fail-under=50
    
    - name: Upload Python coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: python
        name: python-${{ matrix.python-version }}-coverage
        fail_ci_if_error: false
    
    - name: Upload Python coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-${{ matrix.python-version }}-coverage-report
        path: htmlcov/
        retention-days: 30

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check Python code style (Black)
      run: |
        black --check slipspeed/ scripts/ examples/ || true
    
    - name: Check Python imports (isort)
      run: |
        isort --check-only slipspeed/ scripts/ examples/ || true
    
    - name: Lint Python code (flake8)
      run: |
        flake8 slipspeed/ --max-line-length=100 || true

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Markdown files
      run: |
        find . -name "*.md" -type f | head -20

  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [python-tests, code-quality]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        echo "Build Pipeline Summary:"
        echo "✓ Python tests (multiple versions)"
        echo "✓ Code quality checks"
        echo ""
        echo "All tests completed."
